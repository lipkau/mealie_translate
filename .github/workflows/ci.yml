# .github/workflows/ci.yml

name: Continuous Integration

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**" # Still include workflow changes
      - ".vscode/**"
      - "assets/**"
  # No path filter: the required "CI result" check must report on every pull request.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests cancel superseded runs; every push to main and every tag publishes its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm clean-install

      - run: make lint-markdown

  code-quality-and-coverage:
    name: Code Quality & Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.14-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - run: make lint-no-markdown PYTHON=python

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v -m "not integration" --cov=mealie_translate --cov-report=xml --cov-report=term --cov-report=html --junit-xml=pytest-results.xml

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Publish Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Test Results (Coverage)
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-coverage
          path: |
            pytest-results.xml
            coverage.xml
            htmlcov/
          retention-days: 14

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests (no integration)
        run: |
          python -m pytest tests/ -v -m "not integration" --junit-xml=pytest-results-${{ matrix.python-version }}.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: pytest-results-${{ matrix.python-version }}.xml
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          retention-days: 14

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration-tests')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.14-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - run: |
          make test-integration PYTHON=python

      - name: Publish Integration Test Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Integration Test Results
          path: pytest-results-integration.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: |
            pytest-results-integration.xml
            test-logs/
          retention-days: 14

  docker-test:
    name: Dockerfile Testing Target
    runs-on: ubuntu-latest
    needs:
      - markdown
      - code-quality-and-coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: docker build --target testing .

  image:
    name: Image
    needs: [markdown, code-quality-and-coverage, test, docker-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # `latest` is the newest release from main (the action's default, `latest: release`).
      - uses: lipkau/gh-tools/actions/container-image@e3ed36df3d68c66d7ebf27f5ab0d3b0a7cf45af3 # container-image/v1.0.0

  # The only check the main branch ruleset requires, so the matrix can change freely.
  # Add every new job to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [markdown, code-quality-and-coverage, test, integration-test, docker-test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
